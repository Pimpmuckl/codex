name: Codex++ release prebuild

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted branch or commit to prebuild
        required: true
        type: string
      release_version:
        description: Planned Codex++ version (for example 0.153.1-fork.2)
        required: true
        type: string

permissions: {}

concurrency:
  group: codex-plus-plus-prebuild-${{ inputs.source_ref }}-${{ inputs.release_version }}
  cancel-in-progress: true

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}
  APT_UPDATE_ARGS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
  APT_INSTALL_ARGS: --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Require default-branch workflow scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Run this workflow from main so its caches are readable by release tags." >&2
            exit 1
          }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Validate trusted release candidate
        id: source
        shell: bash
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]] || {
            echo "Invalid Codex++ release version: ${VERSION}" >&2
            exit 1
          }
          base_version="${VERSION%%-fork.*}"
          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' codex-rs/Cargo.toml | head -1)"
          [[ "$base_version" == "$workspace_version" ]] || {
            echo "Version base ${base_version} does not match workspace ${workspace_version}" >&2
            exit 1
          }
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  prebuild:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: zip
            executable: bin/codex.exe
          - runner: macos-15
            target: aarch64-apple-darwin
            archive_suffix: tar.gz
            executable: bin/codex
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive_suffix: tar.gz
            executable: bin/codex
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
      AWS_LC_SYS_NO_JITTER_ENTROPY: ${{ matrix.target == 'x86_64-unknown-linux-musl' && '1' || '' }}
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl: ${{ matrix.target == 'x86_64-unknown-linux-musl' && '1' || '' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      LIBSQLITE3_FLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
      SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
      SOURCE_MTIME_STATE: codex-rs/target/codex-plus-plus-source-mtimes-${{ matrix.target }}.json
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$SOURCE_TREE" ]]

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Restore exact native release cache
        id: restore-native
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: codex-plus-plus-native-v1-${{ matrix.target }}-${{ env.SOURCE_TREE }}-${{ env.VERSION }}
          path: dist/prebuilt-${{ matrix.target }}

      - name: Restore cached native package
        if: steps.restore-native.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          prebuilt="dist/prebuilt-${TARGET}"
          archive="${prebuilt}/codex-plus-plus-${VERSION}-${TARGET}.${ARCHIVE_SUFFIX}"
          checksum="${archive}.sha256"
          rm -rf "dist/package-${TARGET}"
          python - "$archive" "$checksum" "dist/package-${TARGET}" <<'PY'
          import hashlib
          from pathlib import Path
          import shutil
          import sys

          archive = Path(sys.argv[1])
          checksum = Path(sys.argv[2])
          package_dir = Path(sys.argv[3])
          expected = checksum.read_text(encoding="utf-8").split()[0]
          digest = hashlib.sha256()
          with archive.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          if digest.hexdigest() != expected:
              raise SystemExit(f"Cached archive checksum mismatch: {archive}")
          package_dir.mkdir(parents=True)
          shutil.unpack_archive(archive, package_dir)
          PY

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: steps.restore-native.outputs.cache-hit != 'true'
        with:
          targets: ${{ matrix.target }}

      - name: Remove runner-provided Rust toolchain
        if: steps.restore-native.outputs.cache-hit != 'true'
        shell: bash
        run: rustup toolchain uninstall stable

      - name: Configure LLVM linker
        if: steps.restore-native.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Resolve release build cache identity
        if: steps.restore-native.outputs.cache-hit != 'true'
        id: release-cache
        shell: bash
        run: |
          set -euo pipefail
          image="${ImageOS:-${RUNNER_OS}}-${ImageVersion:-unknown}"
          toolchain="${{ hashFiles('codex-rs/rust-toolchain.toml') }}"
          build_inputs="${{ hashFiles('.github/actions/setup-msvc-env/**', '.github/scripts/install-musl-build-tools.sh', '.github/workflows/codex-plus-plus-release.yml') }}"
          prefix="codex-plus-plus-release-v4-${TARGET}-${image}-${toolchain}-${build_inputs}"
          {
            echo "key=${prefix}-${SOURCE_TREE}"
            echo "prefix=${prefix}-"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Codex++ release build cache
        if: steps.restore-native.outputs.cache-hit != 'true'
        id: restore-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.release-cache.outputs.key }}
          restore-keys: |
            ${{ steps.release-cache.outputs.prefix }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codex-package
            codex-rs/target/release
            codex-rs/target/${{ matrix.target }}/release
            codex-rs/target/.rustc_info.json
            ${{ env.SOURCE_MTIME_STATE }}

      - name: Regenerate v8 after cache restore
        if: steps.restore-native.outputs.cache-hit != 'true'
        working-directory: codex-rs
        shell: bash
        run: |
          cargo clean -p v8 --target "$TARGET" --profile release
          rm -rf "target/${TARGET}/release/gn_out"

      - name: Install Zig
        if: steps.restore-native.outputs.cache-hit != 'true' && runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: steps.restore-native.outputs.cache-hit != 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '\|azure\.archive\.ubuntu\.com|d' /etc/apt/apt-mirrors.txt
            grep -qE '^[[:space:]]*https?://' /etc/apt/apt-mirrors.txt || { echo "No apt mirror remains" >&2; exit 1; }
          fi
          bash .github/scripts/install-musl-build-tools.sh

      - name: Build bundled bwrap
        if: steps.restore-native.outputs.cache-hit != 'true' && runner.os == 'Linux'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --profile release --bin bwrap
          bwrap="target/${TARGET}/release/bwrap"
          digest="$(sha256sum "$bwrap" | awk '{print $1}')"
          echo "BWRAP=${GITHUB_WORKSPACE}/codex-rs/${bwrap}" >> "$GITHUB_ENV"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Build exact native release
        if: steps.restore-native.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          prebuilt="dist/prebuilt-${TARGET}"
          archive="${prebuilt}/codex-plus-plus-${VERSION}-${TARGET}.${ARCHIVE_SUFFIX}"
          mkdir -p "$prebuilt"
          package_args=(
            --target "$TARGET"
            --package-dir "dist/package-${TARGET}"
            --archive-output "$archive"
            --force
          )
          if [[ -n "${BWRAP:-}" ]]; then
            package_args+=(--bwrap-bin "$BWRAP")
          fi
          python scripts/build_codex_plus_plus.py \
            --fork-version "$VERSION" \
            --build-cache-state "$SOURCE_MTIME_STATE" \
            -- \
            --cargo-profile release \
            "${package_args[@]}"
          python - "$archive" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          archive = Path(sys.argv[1])
          digest = hashlib.sha256()
          with archive.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          archive.with_name(f"{archive.name}.sha256").write_text(
              f"{digest.hexdigest()}  {archive.name}\n",
              encoding="utf-8",
          )
          PY

      - name: Smoke package
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          executable="dist/package-${TARGET}/${EXECUTABLE}"
          [[ "$("$executable" --version)" == "codex-cli ${VERSION}" ]]

      - name: Save Codex++ release build cache
        if: >-
          steps.restore-native.outputs.cache-hit != 'true' &&
          steps.restore-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.release-cache.outputs.key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codex-package
            codex-rs/target/release
            codex-rs/target/${{ matrix.target }}/release
            codex-rs/target/.rustc_info.json
            ${{ env.SOURCE_MTIME_STATE }}

      - name: Save exact native release cache
        if: steps.restore-native.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: codex-plus-plus-native-v1-${{ matrix.target }}-${{ env.SOURCE_TREE }}-${{ env.VERSION }}
          path: dist/prebuilt-${{ matrix.target }}

      - name: Write prebuild result
        shell: bash
        run: |
          {
            echo "### ${TARGET}"
            echo
            echo "- source tree: \`${SOURCE_TREE}\`"
            echo "- version: \`${VERSION}\`"
            echo "- reused exact native cache: \`${{ steps.restore-native.outputs.cache-hit == 'true' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
